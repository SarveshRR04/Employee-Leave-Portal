{# Search + filter form, shared by the Leave Requests and Reports pages. Sends a GET request. #}
<form method="get" class="filters">
  <div class="f wide">
    <label for="q">Search</label>
    <input type="search" id="q" name="q" value="{{ q }}" placeholder="Name, email, code or department">
  </div>
  <div class="f">
    <label for="status">Status</label>
    <select id="status" name="status">
      <option value="">All</option>
      {% for value, label in status_choices %}
        <option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="f">
    <label for="leave_type">Leave Type</label>
    <select id="leave_type" name="leave_type">
      <option value="">All</option>
      {% for t in leave_types %}
        <option value="{{ t.id }}" {% if leave_type == t.id|stringformat:"s" %}selected{% endif %}>{{ t.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="f">
    <label for="from">From</label>
    <input type="date" id="from" name="from" value="{{ from_date }}">
  </div>
  <div class="f">
    <label for="to">To</label>
    <input type="date" id="to" name="to" value="{{ to_date }}">
  </div>
  <button type="submit" class="btn btn-primary">Filter</button>
  <a href="{{ request.path }}" class="btn btn-light">Reset</a>
</form>
